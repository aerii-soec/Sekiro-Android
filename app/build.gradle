plugins {
    id 'com.android.application' version '8.7.2'
}

def validationLayerDir = providers.gradleProperty('vulkanValidationDir')
def localPreviewAssets = providers.gradleProperty('sekiroAssetsDir')

android {
    namespace 'dev.sekiro.nativeport'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'dev.sekiro.nativeport'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '0.4.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    if (validationLayerDir.isPresent()) {
        def layer = file(validationLayerDir.get())
        sourceSets.debug.jniLibs.srcDir(new File(layer, 'jniLibs'))
        sourceSets.debug.assets.srcDir(new File(layer, 'notices'))
    }

    if (localPreviewAssets.isPresent()) {
        def root = file(localPreviewAssets.get())
        ['sekiro/model.flver', 'sekiro/materials.skmp', 'sekiro/preview.tpf'].each { asset ->
            if (!new File(root, asset).isFile()) {
                throw new GradleException("Missing staged Sekiro asset: " + asset)
            }
        }
        sourceSets.debug.assets.srcDir(root)
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
